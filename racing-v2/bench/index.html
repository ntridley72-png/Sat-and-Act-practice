<!doctype html>
<html>
<head><meta charset="utf-8"><title>racing-v2 frame bench</title>
<style>html,body{margin:0;height:100%;background:#0f1216}#root{width:1280px;height:720px}</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  // Loads the PRODUCTION bundle, not dev mode, exactly as the site would.
  const mod = await import('/racing-v2/racing-v2.js')
  const params = new URLSearchParams(location.search)
  const n = Number(params.get('opponents') ?? 0)
  window.__frames = []
  let last = performance.now()
  function tick(t) {
    // After a measurement window is cleared (frame-bench sets __skip), the
    // first delta would otherwise span from the last PRE-window frame to the
    // first post-window one. On a scene whose first paint lands after the
    // clear that boundary delta is seconds long and reads as a one-off stall;
    // an independent rAF recorder in the same page sees no such stall. Skip
    // one delta and re-baseline instead.
    if (window.__skip) { window.__skip = false; last = t }
    else window.__frames.push(t - last)
    last = t
    requestAnimationFrame(tick)
  }
  mod.mount(document.getElementById('root'), {
    opponents: n,
    seed: 'bench',
    track: params.get('track') ?? undefined,
  })
  requestAnimationFrame(tick)
  window.__ready = true
</script>
</body>
</html>
