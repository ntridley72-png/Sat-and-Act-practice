# Dedicated HTTPS owner app. Configure Cloudflare Access for this ENTIRE hostname
# before deploying. No workers.dev or preview URL bypasses the Access hostname.
name = "project-analytics-owner"
main = "worker/analytics-owner.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false
routes = [{pattern = "analytics.funsat.bid", custom_domain = true}]

[build]
command = "node scripts/build-analytics-owner.mjs"

[assets]
directory = "./.analytics-assets"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "sat-act-practice-db"
database_id = "8f1793ec-e23e-439e-9285-55f183146491"

[[ratelimits]]
name = "ANALYTICS_READ_LIMITER"
namespace_id = "714023"
simple = {limit = 30, period = 60}
