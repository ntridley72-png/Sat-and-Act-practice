# ISOLATED PREVIEW of the admissions-analysis branch. Deploy ONLY with:
#   npx wrangler deploy -c wrangler.preview.toml
# Never use scripts/deploy.sh for this file (it also pings IndexNow).
#
# Isolation audit versus wrangler.toml (production):
#   name            different Worker, so production is never replaced
#   routes          NONE: no funsat.bid / www.funsat.bid custom domain
#   workers_dev     true: the only address is funsat-admissions-preview.<subdomain>.workers.dev
#   [ai] binding    OMITTED: no Workers AI calls; AI_MODE=mock returns a canned reply
#   D1              its own empty database (schema only); production records are never copied
#   secrets         NONE are set, so GROQ, Resend mail and Google sign-in stay disabled
#   cron triggers   NONE (no [triggers] block)
#   KV / R2 / queues / analytics / service bindings: none exist in either config
#   vars            PREVIEW_MODE adds X-Robots-Tag noindex (not access control)
name = "funsat-admissions-preview"
main = "worker/index.js"
compatibility_date = "2026-09-01"

workers_dev = true

[vars]
PREVIEW_MODE = "1"
AI_MODE = "mock"
# Exact-match origin allowed to call /api/ai (the preview's own address, printed by the first deploy).
EXTRA_AI_ORIGIN = "https://funsat-admissions-preview.pillcounted.workers.dev"

[build]
command = "rm -rf public && mkdir -p public && cp \"SAT & ACT Practice.html\" public/index.html && cp app.js avatar.js workspace.css workspace.js college-data.js admissions-data.js admissions-model.js college-safety.js college-photos-extra.js college.js college-profile.js college-gallery.js redesign.css redesign.js progress-desk.css progress-desk.js subjects.css subjects.js scholarships-data.js scholarships.js dirtbike.js ads.js ads.txt robots.txt social-card.png apple-touch-icon.png favicon.png favicon.ico favicon-48.png favicon-96.png favicon-192.png favicon.svg logo-512.png *.txt public/ && cp -R fonts racing public/ && if [ -d racing-v2/dist ]; then mkdir -p public/racing-v2 && cp -R racing-v2/dist/. public/racing-v2/; else echo \"racing-v2/dist absent; game not served this preview\" >&2; fi && python3 scripts/build-seo-pages.py --out public && python3 scripts/build-landing-pages.py --out public && python3 scripts/build-hubs.py --out public && python3 scripts/build-sitemaps.py --out public && printf 'User-agent: *\\nDisallow: /\\n' > public/robots.txt"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "funsat-admissions-preview-db"
database_id = "82d518ac-2f2d-41d8-bcd5-7d11417de269"
